<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organ Grinder Extortion</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0710; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; max-width: 960px; aspect-ratio: 800 / 520; display: block; cursor: pointer; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c" width="800" height="520"></canvas>
<script>
/* ORGAN GRINDER EXTORTION
   One number runs the whole game: "mood" (0 to 100).
   - It drains all the time, and drains faster the longer you play.
   - Every coin that lands in the cup adds to it.
   - The monkey's look is worked out from mood: dancing -> slowing -> glaring -> crying. */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 800, H = 520, GROUND = 440, MX = 420;          // MX = monkey's x position
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let state = 'title';                 // 'title' or 'play'
let mood = 80, elapsed = 0, ph = 0, tNow = 0;
let coins = 0, danceTime = 0, weepTime = 0, drain = 5;
let flying = [], tears = [], notes = [];
let cupX = 500, cupY = 330, cupShake = 0, crank = 0;
let man = null, cut = 0, over = false, overTime = 0, lowTime = 0, sawTimer = 0, blood = [];   // the man with the chainsaw

// How much dancing / glaring / crying, each from 0 to 1, based on mood
function levels() {
  return {
    d: clamp((mood - 40) / 30, 0, 1),   // full dance at 70+, stops at 40
    g: clamp((40 - mood) / 20, 0, 1),   // glare grows from 40 down to 20
    c: clamp((22 - mood) / 14, 0, 1)    // crying grows from 22 down to 8
  };
}

/* ---------- Sound (made with the browser, no files needed) ---------- */
let ac = null, noteTimer = 0, whimperTimer = 0, step = 0;
const TUNE = [262,330,392,330,262,330,392,523,494,392,349,392,330,294,262,0];
function tone(f, dur, type, vol, f2) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
}

/* ---------- Input ---------- */
function restart() {
  state = 'play'; mood = 80; elapsed = 0; coins = 0; danceTime = 0; weepTime = 0;
  man = null; cut = 0; over = false; overTime = 0; lowTime = 0; blood = []; flying = []; tears = [];
}
function toss(x, y) {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  if (state === 'title') { restart(); return; }
  if (over) { if (overTime > 2.5) restart(); return; }
  if (cut > 0) return;                                  // too late to tip him
  flying.push({ x0: x, y0: y, u: 0 });
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  toss((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) toss(MX + (Math.random() - .5) * 240, H - 20); }
});

/* ---------- Update (runs every frame) ---------- */
function update(dt) {
  tNow += dt;
  cupShake = Math.max(0, cupShake - dt * 4);
  tears.forEach(t => { t.vy += 320 * dt; t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt; });
  tears = tears.filter(t => t.life > 0);
  notes.forEach(n => { n.y -= 30 * dt; n.x += Math.sin(n.y * 0.05) * 0.4; n.life -= dt; });
  notes = notes.filter(n => n.life > 0);
  blood.forEach(b => { if (!b.landed) { b.vy += 700 * dt; b.x += b.vx * dt; b.y += b.vy * dt; if (b.y > b.gy) { b.y = b.gy; b.landed = true; } } });

  if (state === 'play' && cut === 0 && !over) {
    elapsed += dt;
    drain = 5 + Math.min(elapsed / 25, 9);              // gets pickier over time
    mood = clamp(mood - drain * dt, 0, 100);
  }
  const L = levels();
  ph += dt * (2 + 6 * L.d);
  crank += dt * L.d * 8;

  if (state !== 'play') return;
  if (over) { overTime += dt; return; }

  // ----- the man with the chainsaw -----
  // He shows up if patience stays near zero, walks slowly toward the monkey,
  // and leaves again if you tip enough. If he gets there, he does it.
  lowTime = mood < 8 ? lowTime + dt : 0;
  if (!man && lowTime > 1.5) man = { x: W + 70, moving: true, wait: 0 };
  if (man && cut === 0) {
    if (mood > 22) { man.x += 140 * dt; man.moving = true; man.wait = 0; if (man.x > W + 90) man = null; }
    else if (mood < 12) {
      if (man.x > MX + 190) { man.x = Math.max(MX + 190, man.x - 45 * dt); man.moving = true; }
      else { man.moving = false; man.wait += dt; if (man.wait > 2.2) cut = 0.001; }
    } else man.moving = false;
  }
  if (cut > 0) {
    cut += dt; mood = 0;
    man.x = cut < 1.2 ? MX + 190 - 58 * (cut / 1.2) : MX + 132 + Math.sin(cut * 40) * 1.5;
    if (cut > 1 && cut < 3.6) {
      for (let i = 0, n = Math.round(dt * 180); i < n; i++)
        blood.push({ x: MX + (Math.random() - .5) * 30, y: GROUND - 90 + (Math.random() - .5) * 30,
                     vx: -240 + Math.random() * 330, vy: -80 - Math.random() * 300,
                     gy: GROUND + 4 + Math.random() * 50, r: 2 + Math.random() * 3.5 });
    }
    if (cut > 4.4) { over = true; overTime = 0; }
  }
  if (man) {
    sawTimer -= dt;
    if (sawTimer <= 0) {
      sawTimer = 0.07;
      const rev = cut > 0 ? 1 : man.moving ? 0.4 : 0.8;
      tone(80 + rev * 70 + Math.random() * 25, 0.1, 'sawtooth', 0.02 + 0.04 * rev);
      if (cut > 1.2 && Math.random() < 0.5) tone(40 + Math.random() * 30, 0.12, 'square', 0.06);
    }
  }

  if (L.d > 0.3) danceTime += dt;
  if (L.c > 0.3) weepTime += dt;

  // coins in flight: when one reaches the cup, it counts
  for (const f of flying) {
    f.u += dt / 0.45;
    if (f.u >= 1) { if (cut === 0) { mood = clamp(mood + 8, 0, 100); coins++; } cupShake = 1; tone(1300, 0.12, 'square', 0.04, 1900); }
  }
  flying = flying.filter(f => f.u < 1);

  // organ music: slows and goes flat as he gets sadder, stops when he stops dancing
  noteTimer -= dt;
  if (noteTimer <= 0) {
    noteTimer = 0.3 + (1 - L.d) * 0.5;
    const f = TUNE[step++ % TUNE.length];
    if (L.d > 0.05 && f) tone(f * (0.85 + 0.15 * L.d), 0.3, 'triangle', 0.03 + 0.07 * L.d);
  }
  if (L.d > 0.3 && Math.random() < dt * 2 * L.d) notes.push({ x: 170 + Math.random() * 60, y: GROUND - 110, life: 2 });

  // the whimper
  if (L.c > 0.3 && cut === 0) {
    whimperTimer -= dt;
    if (whimperTimer <= 0) { tone(480, 0.8, 'triangle', 0.05 * L.c, 230); whimperTimer = 1.3 - 0.6 * L.c + Math.random() * 0.5; }
  }
}

/* ---------- Drawing helpers ---------- */
function limb(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ell(x, y, rx, ry, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBG(L) {
  let g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#0d1030'); g.addColorStop(1, '#2a1a3d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // brick wall
  ctx.fillStyle = '#2b1b24'; ctx.fillRect(0, 70, W, GROUND - 70);
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let y = 70, r = 0; y < GROUND; y += 26, r++) {
    ctx.moveTo(0, y); ctx.lineTo(W, y);
    for (let x = (r % 2) * 35; x < W; x += 70) { ctx.moveTo(x, y); ctx.lineTo(x, y + 26); }
  }
  ctx.stroke();
  // cobblestones
  ctx.fillStyle = '#1a1520'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  for (let y = GROUND + 14, r = 0; y < H; y += 24, r++) {
    for (let x = (r % 2) * 30; x < W; x += 60) { ctx.beginPath(); ctx.ellipse(x + 30, y, 26, 9, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  // street lamp: it flickers when the monkey is upset
  let li = 0.9 - 0.4 * L.g;
  if (L.g > 0.3) li *= 0.55 + 0.45 * Math.abs(Math.sin(tNow * 17 + Math.sin(tNow * 5) * 3));
  g = ctx.createRadialGradient(660, 120, 10, 660, 120, 360);
  g.addColorStop(0, 'rgba(255,205,120,' + (li * 0.55) + ')'); g.addColorStop(1, 'rgba(255,205,120,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#0c0910'; ctx.fillRect(656, 120, 8, GROUND - 120);
  ctx.fillStyle = 'rgb(255,' + Math.round(200 + 40 * li) + ',140)'; ctx.fillRect(644, 104, 32, 18);
}

function drawOrgan(L) {
  const x = 110, y = GROUND - 100;
  ctx.fillStyle = '#6b3f1f'; ctx.fillRect(x, y, 150, 100);
  ctx.fillStyle = '#85522a'; ctx.fillRect(x + 6, y + 6, 138, 88);
  ctx.fillStyle = '#d9a93f';
  for (let i = 0; i < 6; i++) ctx.fillRect(x + 14 + i * 22, y - 34 + (i % 3) * 8, 10, 34 - (i % 3) * 8);   // pipes
  ell(x + 45, y + 50, 16, 16, '#5a3419'); ell(x + 105, y + 50, 16, 16, '#5a3419');
  ell(x + 45, y + 50, 7, 7, '#d9a93f'); ell(x + 105, y + 50, 7, 7, '#d9a93f');
  // crank on the side
  const px = x + 150, py = y + 55, hx = px + 8 + Math.cos(crank) * 22, hy = py + Math.sin(crank) * 22;
  limb(px, py, hx, hy, 5, '#d9a93f'); ell(hx, hy, 5, 5, '#f2c94c');
  // chain from the box to the monkey
  ctx.strokeStyle = '#8a8f96'; ctx.lineWidth = 2.5; ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(x + 150, y + 90); ctx.quadraticCurveTo(300, GROUND + 25, MX + 12, GROUND - 52); ctx.stroke();
  ctx.setLineDash([]);
}

function drawMonkey(L) {
  const s = Math.sin(ph), d = L.d, g = L.g, c = L.c;
  const BR = '#5b3a22', DK = '#2d1b10', CR = '#e6cfa8';
  const bounce = Math.abs(s) * d * 16;
  ctx.save();
  ctx.translate(MX, GROUND - bounce);
  ctx.rotate(s * d * 0.07 + Math.sin(tNow * 28) * 0.012 * c);

  // tail
  const tw = Math.sin(ph * 1.3) * 18 * d + Math.sin(tNow * 2) * 3;
  ctx.strokeStyle = BR; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-26, -60); ctx.bezierCurveTo(-80, -50, -95 + tw, -110, -62 + tw, -135); ctx.stroke();

  // legs (they hop when he dances)
  const l1 = Math.max(0, s) * 12 * d, l2 = Math.max(0, -s) * 12 * d;
  limb(-16, -55, -22, -14 - l1, 17, BR); limb(16, -55, 22, -14 - l2, 17, BR);
  ell(-26, -8 - l1, 17, 8, DK); ell(26, -8 - l2, 17, 8, DK);

  // body and little red vest
  ell(0, -88, 38, 48, BR);
  ell(0, -84, 39, 38, '#a3162a');
  ctx.fillStyle = CR; ctx.beginPath(); ctx.moveTo(-13, -120); ctx.lineTo(13, -120); ctx.lineTo(0, -68); ctx.fill();
  if (cut > 1) drawWound(clamp((cut - 1) / 1.6, 0, 1));

  // free arm: waves when he dances, hangs when he doesn't
  const wv = Math.sin(ph + 1);
  const lhx = -64 - wv * 8 * d, lhy = -100 - (wv * 0.5 + 0.5) * 45 * d + 12 * (1 - d) + c * 10;
  limb(-32, -116, lhx, lhy, 13, BR); ell(lhx, lhy, 8, 8, DK);

  // cup arm: held out, shaking when he is upset
  const trem = Math.sin(tNow * 40) * c * 2.5;
  const rhx = 70 + g * 8 + trem + cupShake * Math.sin(tNow * 60) * 3;
  const rhy = -104 - Math.abs(Math.sin(ph * 2)) * 6 * d + 8 * c + trem;
  limb(32, -116, rhx, rhy, 13, BR);
  ctx.save(); ctx.translate(rhx + 4, rhy - 4);
  ctx.fillStyle = '#9aa3ab'; ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(14, -14); ctx.lineTo(10, 12); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#cfd6dc'; ctx.fillRect(-16, -17, 32, 5);
  ctx.restore();
  ell(rhx - 5, rhy + 2, 7, 7, DK);
  const cp = ctx.getTransform().transformPoint(new DOMPoint(rhx + 4, rhy - 14));
  cupX = cp.x; cupY = cp.y;                             // where coins should fly to

  // ----- head -----
  ctx.save();
  ctx.translate(0, -150 + 7 * c);
  ctx.rotate(Math.sin(ph * 0.5) * d * 0.18 + Math.sin(tNow * 25) * 0.04 * c);
  const hs = 1 + 0.1 * g; ctx.scale(hs, hs);
  ell(-34, 2, 9, 10, CR); ell(34, 2, 9, 10, CR);        // ears
  ell(0, 0, 34, 32, BR);
  ctx.fillStyle = DK; ctx.beginPath(); ctx.arc(0, -2, 34, Math.PI * 1.02, -0.02); ctx.fill();   // dark cap of fur
  ell(0, 9, 25, 24, CR);                                // face

  // wet cheeks
  if (c > 0.05) {
    ctx.strokeStyle = 'rgba(150,200,255,' + 0.5 * c + ')'; ctx.lineWidth = 2.4;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 10, 9); ctx.lineTo(sx * 14, 30); ctx.stroke(); }
  }

  // eyes: when he glares, the pupils lock onto the camera
  const ery = 6 - 2.5 * g;
  for (const sx of [-1, 1]) {
    const ex = sx * 10;
    ell(ex, 3, 7, ery, '#fffdf5');
    if (c > 0) { ctx.strokeStyle = 'rgba(190,40,50,' + 0.7 * c + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(ex, 3, 7, ery, 0, 0, Math.PI * 2); ctx.stroke(); }
    const px = ex + (1 - g) * Math.sin(ph * 0.5) * 2.5, py = 3 - c * 1.5, pr = 3.6 + g * 0.8;
    ell(px, py, pr, pr, '#150a05'); ell(px - 1, py - 1.2, 1.1, 1.1, '#fff');
    // eyebrows: angry (inner ends down) then sad (inner ends up)
    const a = g * (1 - c), sd = c;
    const inner = -7 + 5 * a - 8 * sd, outer = -7 - 3 * a + 4 * sd;
    limb(sx * 19, outer, sx * 3, inner, 3.4, DK);
    // tears
    if (c > 0.05 && Math.random() < 0.25 + c * 0.5) {
      const p = ctx.getTransform().transformPoint(new DOMPoint(sx * 10 + (Math.random() - .5) * 4, 10));
      tears.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 20 + sx * 15, vy: 0, life: 1.1 });
    }
  }
  ell(-3, 14, 1.6, 1.2, DK); ell(3, 14, 1.6, 1.2, DK);   // nostrils

  // mouth: smile -> flat frown -> trembling toothy grimace
  const my = 24;
  ctx.strokeStyle = DK; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  if (c > 0.05) {
    const open = 6 + c * 10 + Math.sin(tNow * 9) * 3 * c, w = 12 + c * 7;
    ctx.beginPath(); ctx.moveTo(-w, my + 3);
    ctx.quadraticCurveTo(0, my - 7, w, my + 3);
    ctx.quadraticCurveTo(0, my + 3 + open * 2, -w, my + 3);
    ctx.fillStyle = '#2a0a0e'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#f4efe0';
    ctx.fillRect(-w, my - 3, 2 * w, 5); ctx.fillRect(-w, my + open - 2, 2 * w, 6);
    ctx.strokeStyle = DK; ctx.lineWidth = 1;
    for (let i = -3; i <= 3; i++) { const tx = i * w / 3.5; ctx.beginPath(); ctx.moveTo(tx, my - 3); ctx.lineTo(tx, my + 2); ctx.moveTo(tx, my + open - 2); ctx.lineTo(tx, my + open + 4); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = DK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w, my + 3); ctx.quadraticCurveTo(0, my - 7, w, my + 3); ctx.quadraticCurveTo(0, my + 3 + open * 2, -w, my + 3); ctx.stroke();
  } else if (g > 0.05) {
    ctx.beginPath(); ctx.moveTo(-10, my + 3); ctx.quadraticCurveTo(0, my + 3 - 8 * g, 10, my + 3); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-11, my); ctx.quadraticCurveTo(0, my + 4 + 16 * d, 11, my);
    if (d > 0.4) { ctx.quadraticCurveTo(0, my + 1, -11, my); ctx.fillStyle = '#2a0a0e'; ctx.fill(); }
    ctx.stroke();
  }

  // little fez with a tassel
  ctx.save(); ctx.translate(2, -30); ctx.rotate(-0.15);
  ctx.fillStyle = '#b3182c'; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-11, -20); ctx.lineTo(11, -20); ctx.lineTo(14, 0); ctx.closePath(); ctx.fill();
  const tsw = Math.sin(ph * 1.5) * 3 * d;
  limb(0, -20, 13 + tsw, -10, 2, '#e8c14a'); ell(13 + tsw, -8, 2.5, 4, '#e8c14a');
  ctx.restore();

  ctx.restore();  // head
  ctx.restore();  // body
}

// a crude jagged red opening in the chest, growing from 0 to 1
function drawWound(k) {
  const pts = [[0,-118],[.6,-108],[.3,-98],[1,-88],[.4,-76],[.8,-66],[0,-58],[-.7,-68],[-.3,-78],[-1,-90],[-.4,-100],[-.7,-110]];
  const path = sc => {
    ctx.beginPath();
    pts.forEach((p, i) => {
      const x = p[0] * 22 * k * sc + Math.sin(tNow * 30 + i) * 1.5 * k, y = p[1];
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    });
    ctx.closePath();
  };
  path(1); ctx.fillStyle = '#4d050d'; ctx.fill();
  path(0.62); ctx.fillStyle = '#a3162a'; ctx.fill();
  ctx.fillStyle = '#3a0409';
  ctx.beginPath(); ctx.ellipse(-3 * k, -92, 6 * k, 9 * k, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5 * k, -80, 5 * k, 7 * k, -0.2, 0, Math.PI * 2); ctx.fill();
}

// the man: a flat black shape with a blank pale face, holding a chainsaw
function drawMan() {
  if (!man) return;
  const x = man.x, sawing = cut > 0, BLK = '#0c0a0f', SK = '#cfc7b8';
  const bob = man.moving ? Math.abs(Math.sin(tNow * 6)) * 4 : 0, sw = man.moving ? Math.sin(tNow * 6) * 14 : 0;
  const by = GROUND - bob, sy = by - 88;
  ctx.save(); ctx.translate(sawing ? (Math.random() - .5) * 3 : 0, 0);
  limb(x - 10, by - 100, x - 10 + sw, by - 6, 17, BLK); limb(x + 12, by - 100, x + 12 - sw, by - 6, 17, BLK);
  ctx.fillStyle = BLK; ctx.beginPath(); ctx.moveTo(x - 30, by - 218); ctx.lineTo(x + 28, by - 218); ctx.lineTo(x + 38, by - 85); ctx.lineTo(x - 38, by - 85); ctx.closePath(); ctx.fill();
  ell(x - 4, by - 244, 23, 23, BLK);                    // hood
  ell(x - 10, by - 242, 14, 18, SK);                    // blank face
  limb(x - 22, by - 205, x - 52, by - 96, 15, BLK); limb(x + 18, by - 205, x - 6, by - 100, 15, BLK);
  // chainsaw: grey bar with a moving chain, orange body
  ctx.fillStyle = '#9aa0a6'; ctx.fillRect(x - 120, sy - 6, 62, 12);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
  ctx.lineDashOffset = -tNow * 160 * (sawing || !man.moving ? 1 : 0.3);
  ctx.beginPath(); ctx.moveTo(x - 120, sy - 6); ctx.lineTo(x - 58, sy - 6); ctx.moveTo(x - 120, sy + 6); ctx.lineTo(x - 58, sy + 6); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#e8731a'; ctx.fillRect(x - 62, sy - 16, 50, 30);
  ctx.fillStyle = '#222'; ctx.fillRect(x - 14, sy - 12, 16, 22);
  ell(x - 52, sy + 4, 8, 8, BLK); ell(x - 8, sy + 8, 8, 8, BLK);
  ctx.restore();
}

function drawOver() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#b3182c'; ctx.font = 'italic 34px Georgia, serif';
  ctx.fillText("He didn't even try to run.", W / 2, 230);
  if (overTime > 1.2) {
    ctx.globalAlpha = clamp((overTime - 1.2) / 1, 0, 1); ctx.fillStyle = '#8a8070'; ctx.font = '17px Georgia, serif';
    ctx.fillText('Coins tipped: ' + coins + '   Danced for ' + danceTime.toFixed(0) + 's   Wept for ' + weepTime.toFixed(0) + 's', W / 2, 280);
    ctx.globalAlpha = 1;
  }
  if (overTime > 2.5) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(tNow * 3); ctx.fillStyle = '#e8d9b0'; ctx.font = 'bold 20px Georgia, serif';
    ctx.fillText('Click to try again', W / 2, 350); ctx.globalAlpha = 1;
  }
}

function drawEffects() {
  for (const b of blood) { ctx.fillStyle = '#8f0f1c'; ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r, b.landed ? b.r * 0.5 : b.r, 0, 0, Math.PI * 2); ctx.fill(); }
  for (const t of tears) { ctx.fillStyle = 'rgba(170,215,255,' + clamp(t.life, 0, 0.85) + ')'; ctx.beginPath(); ctx.ellipse(t.x, t.y, 2.2, 3.6, 0, 0, Math.PI * 2); ctx.fill(); }
  for (const f of flying) {
    const x = f.x0 + (cupX - f.x0) * f.u, y = f.y0 + (cupY - f.y0) * f.u - Math.sin(Math.PI * f.u) * 70;
    const w = Math.abs(Math.cos(f.u * 14)) * 9 + 1;
    ctx.fillStyle = '#f2c94c'; ctx.strokeStyle = '#a77c14'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(x, y, w, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#e8c14a'; ctx.font = '22px Georgia, serif'; ctx.textAlign = 'center';
  for (const n of notes) { ctx.globalAlpha = clamp(n.life, 0, 1); ctx.fillText('\u266A', n.x, n.y); }
  ctx.globalAlpha = 1;
}

function drawHUD(L) {
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(16, 16, 262, 50);
  ctx.fillStyle = '#e8d9b0'; ctx.font = 'bold 14px Georgia, serif';
  ctx.fillText("Monkey's patience", 26, 36);
  ctx.fillStyle = '#000'; ctx.fillRect(26, 44, 242, 12);
  ctx.fillStyle = 'hsl(' + Math.round(mood * 1.2) + ',70%,50%)'; ctx.fillRect(27, 45, 240 * mood / 100, 10);

  ctx.textAlign = 'right'; ctx.font = '15px Georgia, serif'; ctx.fillStyle = '#e8d9b0';
  ctx.fillText('Coins tipped: ' + coins, W - 18, 32);
  ctx.fillText('Danced for ' + danceTime.toFixed(0) + 's', W - 18, 52);
  ctx.fillText('Wept for ' + weepTime.toFixed(0) + 's', W - 18, 72);
  ctx.fillStyle = '#f2c94c'; ctx.fillText('He expects about ' + (drain / 8).toFixed(1) + ' coins a second', W - 18, 94);

  const m = mood;
  const line = man ? (mood > 22 ? 'The man is leaving. For now.' : 'Someone is coming.') : m > 80 ? "He's happy. For now." : m > 60 ? "Don't stop now." : m > 40 ? 'His dance is slowing...' :
               m > 22 ? 'He is staring at you.' : m > 8 ? 'His lip is trembling.' : 'Look what you have done.';
  ctx.textAlign = 'center'; ctx.font = 'italic 22px Georgia, serif';
  ctx.fillStyle = m > 40 ? '#e8d9b0' : m > 22 ? '#e8a07a' : '#d9534f';
  ctx.fillText(line, W / 2, H - 22);
}

function drawTitle() {
  ctx.fillStyle = 'rgba(8,4,14,.62)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 14;
  ctx.fillStyle = '#f2c94c'; ctx.font = 'bold 50px Georgia, serif';
  ctx.fillText('ORGAN GRINDER', W / 2, 150);
  ctx.fillStyle = '#d9534f'; ctx.fillText('EXTORTION', W / 2, 205);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#e8d9b0'; ctx.font = 'italic 20px Georgia, serif';
  ctx.fillText('Keep the little guy tipped, or he will make you regret it.', W / 2, 262);
  ctx.font = '17px Georgia, serif';
  ctx.fillText('Click, tap or press Space to toss coins into his cup.', W / 2, 296);
  ctx.fillText('He gets pickier the longer you watch.', W / 2, 320);
  ctx.globalAlpha = 0.55 + 0.45 * Math.sin(tNow * 3);
  ctx.fillStyle = '#f2c94c'; ctx.font = 'bold 22px Georgia, serif';
  ctx.fillText('Click to begin', W / 2, 380);
  ctx.globalAlpha = 1;
}

function draw() {
  const L = levels();
  const sh = cut > 1 ? 5 : 0;
  ctx.save(); ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
  drawBG(L); drawOrgan(L);
  if (cut > 1) { const k = clamp((cut - 1) / 1.6, 0, 1); ell(MX, GROUND + 24, 20 + k * 90, 4 + k * 16, '#4d050d'); }
  drawMonkey(L); drawMan(); drawEffects();
  ctx.restore();
  // the room gets darker as he gets angrier
  const v = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 520);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,' + (0.3 + 0.5 * L.g) + ')');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (cut > 3.3) { ctx.fillStyle = 'rgba(0,0,0,' + clamp((cut - 3.3) / 0.9, 0, 1) + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle(); else if (over) drawOver(); else if (cut === 0) drawHUD(L);
}

let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
