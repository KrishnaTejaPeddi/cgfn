<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organ Grinder Extortion</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0710; display: flex; align-items: center; justify-content: center; }
  canvas { width: 100%; max-width: 960px; aspect-ratio: 800 / 520; display: block; cursor: pointer; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="c" width="800" height="520"></canvas>
<script>
/* ORGAN GRINDER EXTORTION
   One number runs the whole game: "mood" (0 to 100).
   - It drains all the time, and drains faster the longer you play.
   - Every coin that lands in the cup adds to it.
   - The monkey's look is worked out from mood: dancing -> slowing -> glaring -> crying. */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 800, H = 520, GROUND = 440, MX = 420, WORLD = 3000, ENDCAM = 2150, PX = 2480;   // PX = where his father lies          // MX = monkey's x position
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

let state = 'title';                 // 'title' or 'play'
let mood = 80, elapsed = 0, ph = 0, tNow = 0;
let coins = 0, danceTime = 0, weepTime = 0, drain = 5;
let flying = [], tears = [], notes = [];
let cupX = 500, cupY = 330, cupShake = 0, crank = 0;
let pan = 0, over = false, overTime = 0, lowTime = 0, sawTimer = 0, glance = 0, cam = 0, camV = 0;   // the ending

// How much dancing / glaring / crying, each from 0 to 1, based on mood
function levels() {
  return {
    d: clamp((mood - 40) / 30, 0, 1),   // full dance at 70+, stops at 40
    g: clamp((40 - mood) / 20, 0, 1),   // glare grows from 40 down to 20
    c: clamp((22 - mood) / 14, 0, 1)    // crying grows from 22 down to 8
  };
}

/* ---------- Sound (made with the browser, no files needed) ---------- */
let ac = null, noteTimer = 0, whimperTimer = 0, step = 0;
const TUNE = [262,330,392,330,262,330,392,523,494,392,349,392,330,294,262,0];
function tone(f, dur, type, vol, f2) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur);
}

/* ---------- Input ---------- */
function restart() {
  state = 'play'; mood = 80; elapsed = 0; coins = 0; danceTime = 0; weepTime = 0;
  pan = 0; over = false; overTime = 0; lowTime = 0; glance = 0; cam = 0; camV = 0; flying = []; tears = [];
}
function toss(x, y) {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  if (state === 'title') { restart(); return; }
  if (over) { if (overTime > 2) restart(); return; }
  if (pan > 0) return;                                  // too late to tip him
  flying.push({ x0: x + cam, y0: y, u: 0 });
}
cv.addEventListener('pointerdown', e => {
  const r = cv.getBoundingClientRect();
  toss((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) toss(MX + (Math.random() - .5) * 240, H - 20); }
});

/* ---------- Update (runs every frame) ---------- */
function update(dt) {
  tNow += dt;
  cupShake = Math.max(0, cupShake - dt * 4);
  tears.forEach(t => { t.vy += 320 * dt; t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt; });
  tears = tears.filter(t => t.life > 0);
  notes.forEach(n => { n.y -= 30 * dt; n.x += Math.sin(n.y * 0.05) * 0.4; n.life -= dt; });
  notes = notes.filter(n => n.life > 0);

  if (state === 'play' && pan === 0 && !over) {
    elapsed += dt;
    drain = 5 + Math.min(elapsed / 25, 9);              // gets pickier over time
    mood = clamp(mood - drain * dt, 0, 100);
  }
  const L = levels();
  ph += dt * (2 + 6 * L.d);
  crank += dt * L.d * 8;

  if (state !== 'play') return;
  if (over) { overTime += dt; return; }

  // ----- the ending -----
  // While his patience sits at the bottom, the camera starts to slowly drift sideways, as if
  // it can't stay on him. Tip in time and it drifts back. If not, it keeps going to his parents.
  if (pan === 0) {
    lowTime = mood < 8 ? lowTime + dt : 0;
    if (lowTime > 4) pan = 0.001;
  } else {
    pan += dt; mood = Math.max(0, mood - 4 * dt);
    sawTimer -= dt;
    if (sawTimer <= 0) { tone(55, 2.6, 'sine', 0.04 * clamp(pan / 3, 0, 1)); sawTimer = 2.4; }   // a low hum fades in
    if (pan > 15) { over = true; overTime = 0; }
  }
  const camTarget = pan > 0 ? Math.min(ENDCAM, 70 + 300 * pan) : clamp((lowTime - 1.2) / 2.8, 0, 1) * 70;
  camV += ((camTarget - cam) * 5 - camV * 4.47) * dt;       // a smooth spring: the camera eases in and settles gently
  cam += camV * dt;

  if (L.d > 0.3) danceTime += dt;
  if (L.c > 0.3) weepTime += dt;

  // coins in flight: when one reaches the cup, it counts
  for (const f of flying) {
    f.u += dt / 0.45;
    if (f.u >= 1) { if (pan === 0) { mood = clamp(mood + 8, 0, 100); coins++; } cupShake = 1; tone(1300, 0.12, 'square', 0.04, 1900); }
  }
  flying = flying.filter(f => f.u < 1);

  // organ music: slows and goes flat as he gets sadder, stops when he stops dancing
  noteTimer -= dt;
  if (noteTimer <= 0) {
    noteTimer = 0.3 + (1 - L.d) * 0.5;
    const f = TUNE[step++ % TUNE.length];
    if (L.d > 0.05 && f) tone(f * (0.85 + 0.15 * L.d), 0.3, 'triangle', 0.03 + 0.07 * L.d);
  }
  if (L.d > 0.3 && Math.random() < dt * 2 * L.d) notes.push({ x: 170 + Math.random() * 60, y: GROUND - 110, life: 2 });

  // the whimper
  if (L.c > 0.3 && pan < 3) {
    whimperTimer -= dt;
    if (whimperTimer <= 0) { tone(480, 0.8, 'triangle', 0.05 * L.c * clamp(1 - pan / 3, 0, 1), 230); whimperTimer = 1.3 - 0.6 * L.c + Math.random() * 0.5; }
  }
}

/* ---------- Drawing helpers ---------- */
function limb(x1, y1, x2, y2, w, col) {
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function ell(x, y, rx, ry, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBG(L) {
  const WW = WORLD;                                     // the whole street, drawn as one piece
  let g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#0d1030'); g.addColorStop(1, '#2a1a3d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, WW, H);
  // brick wall
  ctx.fillStyle = '#2b1b24'; ctx.fillRect(0, 70, WW, GROUND - 70);
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let y = 70, r = 0; y < GROUND; y += 26, r++) {
    ctx.moveTo(0, y); ctx.lineTo(WW, y);
    for (let x = (r % 2) * 35; x < WW; x += 70) { ctx.moveTo(x, y); ctx.lineTo(x, y + 26); }
  }
  ctx.stroke();
  // cobblestones
  ctx.fillStyle = '#1a1520'; ctx.fillRect(0, GROUND, WW, H - GROUND);
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 2;
  for (let y = GROUND + 14, r = 0; y < H; y += 24, r++) {
    for (let x = (r % 2) * 30; x < WW; x += 60) { ctx.beginPath(); ctx.ellipse(x + 30, y, 26, 9, 0, 0, Math.PI * 2); ctx.stroke(); }
  }
  // street lamps, evenly spaced along the street: they flicker when the monkey is upset
  let li = 0.9 - 0.4 * L.g;
  if (L.g > 0.3) li *= 0.55 + 0.45 * Math.abs(Math.sin(tNow * 17 + Math.sin(tNow * 5) * 3));
  for (const lx of [660, 660 + W]) {
    g = ctx.createRadialGradient(lx, 120, 10, lx, 120, 360);
    g.addColorStop(0, 'rgba(255,205,120,' + (li * 0.55) + ')'); g.addColorStop(1, 'rgba(255,205,120,0)');
    ctx.fillStyle = g; ctx.fillRect(lx - 360, 0, 720, H);
    ctx.fillStyle = '#0c0910'; ctx.fillRect(lx - 4, 120, 8, GROUND - 120);
    ctx.fillStyle = 'rgb(255,' + Math.round(200 + 40 * li) + ',140)'; ctx.fillRect(lx - 16, 104, 32, 18);
  }
}

/* ---------- Everyday clutter: bins, bags, litter, puddles, so the street feels lived in ---------- */
const inView = x => x > cam - 170 && x < cam + W + 170;      // only draw things the camera can see

function trashCan(x, lean, full) {                           // dented metal bin, trash piled over the top if full
  if (!inView(x)) return;
  ctx.save(); ctx.translate(x, GROUND + 16); ctx.rotate(lean);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(0, 2, 26, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#4b5258'; ctx.fillRect(-18, -58, 36, 58);
  ctx.fillStyle = '#5d656c'; ctx.fillRect(-18, -58, 9, 58);
  ctx.strokeStyle = '#2f3438'; ctx.lineWidth = 2;
  for (const yy of [-44, -28, -12]) { ctx.beginPath(); ctx.moveTo(-18, yy); ctx.lineTo(18, yy); ctx.stroke(); }
  ctx.fillStyle = '#394046'; ctx.fillRect(-21, -63, 42, 7);
  if (full) { ell(-6, -66, 13, 8, '#1b1d22'); ell(9, -68, 10, 7, '#2b3a2b'); ell(0, -74, 5, 4, '#d8d2bc'); ell(-13, -71, 3, 5, '#9aa3ab'); }
  ctx.restore();
}

function bagPile(x) {                                        // black bin bags slumped against the wall
  if (!inView(x)) return;
  const y = GROUND + 16;
  ell(x, y, 40, 6, 'rgba(0,0,0,.3)');
  ell(x - 14, y - 12, 18, 13, '#14161b'); ell(x + 10, y - 9, 16, 11, '#1f2a22'); ell(x - 2, y - 26, 14, 11, '#2a2a30');
  ell(x - 18, y - 17, 5, 3, 'rgba(255,255,255,.12)'); ell(x + 6, y - 13, 4, 2.5, 'rgba(255,255,255,.1)');
  ctx.strokeStyle = '#0c0d10'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 4, y - 36); ctx.lineTo(x - 8, y - 42); ctx.moveTo(x + 2, y - 36); ctx.lineTo(x + 6, y - 43); ctx.stroke();
}

function boxes(x) {                                          // soggy cardboard boxes
  if (!inView(x)) return;
  const y = GROUND + 14;
  ell(x, y, 36, 5, 'rgba(0,0,0,.3)');
  ctx.fillStyle = '#8a6a3c'; ctx.fillRect(x - 24, y - 30, 48, 30);
  ctx.fillStyle = '#6e5230'; ctx.fillRect(x - 4, y - 30, 8, 30);
  ctx.save(); ctx.translate(x + 4, y - 30); ctx.rotate(0.12);
  ctx.fillStyle = '#9a7a48'; ctx.fillRect(-16, -20, 32, 20); ctx.fillStyle = '#7a5e38'; ctx.fillRect(-3, -20, 6, 20);
  ctx.restore();
}

function hydrant(x) {
  if (!inView(x)) return;
  const y = GROUND + 16;
  ell(x, y, 18, 4, 'rgba(0,0,0,.35)');
  ctx.fillStyle = '#a83228'; ctx.fillRect(x - 9, y - 34, 18, 34); ctx.fillRect(x - 15, y - 26, 30, 8);
  ell(x, y - 34, 9, 6, '#b8382d'); ctx.fillStyle = '#8d2820'; ctx.fillRect(x - 12, y - 6, 24, 6);
  ell(x, y - 40, 3, 3, '#8d2820'); ell(x - 12, y - 22, 3, 3, '#6e1e18'); ell(x + 12, y - 22, 3, 3, '#6e1e18');
}

function litter(x, dy, k) {                                  // loose rubbish on the ground: paper, can, bottle, newspaper, bag
  if (!inView(x)) return;
  ctx.save(); ctx.translate(x, GROUND + dy); ctx.rotate(((x * 7) % 10) / 10 * 3.14);
  if (k === 0) { ell(0, 0, 6, 4.5, '#d8d2bc'); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-4, -1); ctx.lineTo(3, 2); ctx.stroke(); }
  else if (k === 1) { ctx.fillStyle = '#9aa3ab'; ctx.fillRect(-7, -3, 14, 6); ctx.fillStyle = '#c9423a'; ctx.fillRect(-3, -3, 6, 6); }
  else if (k === 2) { ctx.fillStyle = 'rgba(70,130,80,.8)'; ctx.fillRect(-9, -2.5, 14, 5); ctx.fillRect(5, -1.2, 5, 2.4); }
  else if (k === 3) {
    ctx.fillStyle = '#b9b5a5'; ctx.beginPath(); ctx.moveTo(-12, -5); ctx.lineTo(10, -7); ctx.lineTo(12, 5); ctx.lineTo(-10, 7); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(-9, i * 2); ctx.lineTo(9, i * 2 - 1); ctx.stroke(); }
  }
  else ell(0, 0, 9, 5, 'rgba(220,220,230,.55)');
  ctx.restore();
}

function puddle(x, dy, w) {                                  // wet patch that catches a little light
  if (!inView(x)) return;
  ell(x, GROUND + dy, w, w * 0.22, 'rgba(70,80,120,.45)'); ell(x - w * 0.2, GROUND + dy - 1, w * 0.45, w * 0.08, 'rgba(255,230,180,.18)');
}

function manhole(x) {                                        // steam slowly drifts up from the street
  if (!inView(x)) return;
  const y = GROUND + 46;
  ell(x, y, 34, 8, '#26242b'); ell(x, y - 1, 30, 6.5, '#34313a');
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.5; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * 10 - 4, y - 6); ctx.lineTo(x + i * 10 + 4, y + 4); ctx.stroke(); }
  for (let i = 0; i < 5; i++) {
    const u = (tNow * 0.35 + i / 5) % 1;
    ell(x + Math.sin(u * 6 + i) * 10, y - 6 - u * 90, 8 + u * 18, 6 + u * 12, 'rgba(210,215,230,' + 0.18 * (1 - u) + ')');
  }
}

function drainpipe(x) {                                      // rusty pipe down the wall, leaking at the bottom
  if (!inView(x)) return;
  ctx.fillStyle = '#3a3d44'; ctx.fillRect(x - 5, 80, 10, GROUND - 80);
  ctx.fillStyle = '#4a4e56'; for (let y = 120; y < GROUND; y += 90) ctx.fillRect(x - 8, y, 16, 4);
  ell(x, 260, 6, 60, 'rgba(120,60,30,.25)');
  ell(x, GROUND + 6, 14, 3, 'rgba(70,80,120,.4)');
}

function graffiti(x, y) {                                    // scrawled spray paint, with drips
  if (!inView(x)) return;
  ctx.lineCap = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(190,60,150,.75)';
  ctx.beginPath(); ctx.moveTo(x, y + 20); ctx.bezierCurveTo(x + 20, y - 30, x + 40, y + 50, x + 60, y); ctx.bezierCurveTo(x + 75, y - 25, x + 90, y + 30, x + 110, y - 5); ctx.stroke();
  ctx.strokeStyle = 'rgba(70,200,160,.65)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x + 8, y + 34); ctx.lineTo(x + 100, y + 22); ctx.stroke();
  ctx.strokeStyle = 'rgba(190,60,150,.6)'; ctx.lineWidth = 1.6;
  for (const dx of [20, 60, 100]) { ctx.beginPath(); ctx.moveTo(x + dx, y + 18); ctx.lineTo(x + dx + 1, y + 50 + (dx % 3) * 8); ctx.stroke(); }
}

function boardedWindow(x, y) {
  if (!inView(x)) return;
  ctx.fillStyle = '#15151b'; ctx.fillRect(x, y, 44, 60);
  ctx.save(); ctx.translate(x + 22, y + 30);
  ctx.rotate(-0.12); ctx.fillStyle = '#6b5a3a'; ctx.fillRect(-30, -6, 60, 10);
  ctx.rotate(0.3); ctx.fillStyle = '#5a4a2e'; ctx.fillRect(-30, 8, 60, 10);
  ctx.restore();
}

function flyer(x, y, col) {                                  // small torn notices stuck to the wall
  if (!inView(x)) return;
  ctx.fillStyle = col; ctx.fillRect(x, y, 22, 30);
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x + 3, y + 5 + i * 5); ctx.lineTo(x + 19 - (i % 2) * 5, y + 5 + i * 5); ctx.stroke(); }
}

function drawStreetProps() {
  // on the walls
  drainpipe(40); drainpipe(1690); drainpipe(2190);
  flyer(560, 210, '#b9b08a'); flyer(588, 238, '#8fa3b0'); flyer(1110, 280, '#c4a98a'); flyer(1495, 250, '#a8b08a');
  boardedWindow(900, 160); boardedWindow(1600, 150); graffiti(1510, 250);
  // on the ground
  boxes(55); trashCan(735, 0, true); bagPile(790);
  trashCan(880, 0.05, true); puddle(960, 34, 55); hydrant(1130); manhole(1560); bagPile(1480); trashCan(1180, -0.04, false);
  puddle(1330, 40, 70); boxes(2215); trashCan(2160, 0.03, true);
  for (const l of [[80,40,0],[330,58,3],[600,34,1],[690,60,2],[755,30,4],[850,50,3],[910,28,0],[940,64,1],[1010,40,2],[1075,58,0],[1160,30,4],[1230,62,3],[1290,36,1],[1360,56,0],[1420,30,2],[1470,66,3],[1520,40,0],[1590,54,1],[1640,32,4],[1690,60,2],[1750,38,0],[1830,64,3],[1990,44,0],[2040,58,1],[2120,34,2],[2400,30,0],[2420,55,3],[2395,55,2],[2780,50,4],[2900,36,0]]) litter(l[0], l[1], l[2]);
}

/* ---------- The street's story: things the camera passes on its way to his parents ---------- */

// a faded, peeling poster of the family act: two big capuchins, a little one, and an organ
function drawPoster(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-0.04);
  ctx.fillStyle = '#d8cdaa'; ctx.fillRect(-38, -52, 76, 104);
  ctx.fillStyle = 'rgba(110,85,50,.28)'; ctx.beginPath(); ctx.ellipse(-8, 30, 26, 14, 0.3, 0, Math.PI * 2); ctx.fill();   // water stain
  const mk = (mx, my, s) => {                                              // one happy little capuchin
    ell(mx, my + 10 * s, 7 * s, 10 * s, '#4a3626');
    ell(mx, my - 4 * s, 6.5 * s, 6.5 * s, '#e0d3b0');
    ctx.fillStyle = '#4a3626'; ctx.beginPath(); ctx.arc(mx, my - 6 * s, 6.5 * s, Math.PI, 0); ctx.fill();
    ell(mx - 2.5 * s, my - 3 * s, 0.9 * s, 0.9 * s, '#2a1a10'); ell(mx + 2.5 * s, my - 3 * s, 0.9 * s, 0.9 * s, '#2a1a10');
    ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(mx, my - 1.5 * s, 2.5 * s, 0.15, Math.PI - 0.15); ctx.stroke();
  };
  mk(-18, -16, 1.15); mk(18, -12, 1.0); mk(0, 4, 0.7);                       // father, mother, baby
  ctx.fillStyle = '#7a4a22'; ctx.fillRect(-15, 24, 30, 15);                  // the organ
  ctx.fillStyle = '#b08a3a'; for (let i = 0; i < 4; i++) ctx.fillRect(-12 + i * 7, 18, 3, 7);
  ctx.fillStyle = 'rgba(150,140,120,.35)'; ctx.fillRect(-38, -52, 76, 104);  // faded
  ctx.fillStyle = '#2b1b24'; ctx.beginPath(); ctx.moveTo(38, 52); ctx.lineTo(18, 52); ctx.lineTo(38, 30); ctx.closePath(); ctx.fill();   // torn corner
  ctx.fillStyle = 'rgba(200,190,150,.6)'; ctx.fillRect(-42, -56, 16, 7); ctx.fillRect(26, -56, 16, 7);   // old tape
  ctx.restore();
}

// chalk tally marks, low on the wall where something small could reach: groups of five
function drawTally(x, y) {
  ctx.strokeStyle = 'rgba(235,232,220,.7)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  for (let g = 0; g < 9; g++) {
    const gx = x + (g % 5) * 46, gy = y + Math.floor(g / 5) * 48, full = g < 8;
    for (let i = 0; i < (full ? 4 : 3); i++) {
      const lx = gx + i * 8;
      ctx.beginPath(); ctx.moveTo(lx + Math.sin(g * 3 + i) * 1.2, gy); ctx.lineTo(lx + Math.cos(g + i * 2) * 1.5, gy + 30); ctx.stroke();
    }
    if (full) { ctx.beginPath(); ctx.moveTo(gx - 5, gy + 24); ctx.lineTo(gx + 33, gy + 6); ctx.stroke(); }   // the fifth mark crosses the four
  }
  ctx.fillStyle = '#eee'; ctx.fillRect(x + 200, GROUND - 6, 9, 4);           // the chalk stub
}

// the hospital front: lit windows, a shut door, and a hand-painted sign that says what it costs
function drawHospital() {
  const x0 = 1700, x1 = 2150;
  ctx.fillStyle = '#4a4a54'; ctx.fillRect(x0, 100, x1 - x0, GROUND - 100);
  ctx.fillStyle = '#34343c'; ctx.fillRect(x0 - 6, 94, x1 - x0 + 12, 14);
  const wins = [[1730, 140, 1], [1790, 140, 0], [1990, 140, 1], [2050, 140, 1], [1730, 215, 0], [1790, 215, 1], [1990, 215, 1], [2050, 215, 0]];
  for (const w of wins) {
    ctx.fillStyle = w[2] ? '#e8c97a' : '#15151b'; ctx.fillRect(w[0], w[1], 40, 56);
    ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = 3; ctx.strokeRect(w[0], w[1], 40, 56);
    ctx.beginPath(); ctx.moveTo(w[0] + 20, w[1]); ctx.lineTo(w[0] + 20, w[1] + 56); ctx.moveTo(w[0], w[1] + 28); ctx.lineTo(w[0] + 40, w[1] + 28); ctx.stroke();
  }
  ctx.fillStyle = '#22222a'; ctx.fillRect(1835, 112, 180, 30);               // roof sign
  ctx.save(); ctx.shadowColor = '#9fc3ff'; ctx.shadowBlur = 8; ctx.fillStyle = '#dfe9ff';
  ctx.font = 'bold 20px Georgia, serif'; ctx.textAlign = 'center'; ctx.fillText('HOSPITAL', 1925, 134); ctx.restore();
  ctx.fillStyle = '#2c2420'; ctx.fillRect(1895, GROUND - 100, 60, 100);       // the shut door
  ctx.fillStyle = '#3a302a'; ctx.fillRect(1900, GROUND - 94, 22, 44); ctx.fillRect(1928, GROUND - 94, 22, 44);
  ell(1946, GROUND - 48, 3, 3, '#c9a93f');
  ctx.fillStyle = '#58545a'; ctx.fillRect(1885, GROUND - 10, 80, 10);         // the step

function drawMonkey(L) {
  const s = Math.sin(ph), d = L.d, g = L.g, c = L.c;
  const BR = '#5b3a22', DK = '#2d1b10', CR = '#e6cfa8';
  const bounce = Math.abs(s) * d * 16;
  ctx.save();
  ctx.translate(MX, GROUND - bounce);
  ctx.rotate(s * d * 0.07 + Math.sin(tNow * 28) * 0.012 * c);

  // tail
  const tw = Math.sin(ph * 1.3) * 18 * d + Math.sin(tNow * 2) * 3;
  ctx.strokeStyle = BR; ctx.lineWidth = 11; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-26, -60); ctx.bezierCurveTo(-80, -50, -95 + tw, -110, -62 + tw, -135); ctx.stroke();

  // legs (they hop when he dances)
  const l1 = Math.max(0, s) * 12 * d, l2 = Math.max(0, -s) * 12 * d;
  limb(-16, -55, -22, -14 - l1, 17, BR); limb(16, -55, 22, -14 - l2, 17, BR);
  ell(-26, -8 - l1, 17, 8, DK); ell(26, -8 - l2, 17, 8, DK);

  // body and little red vest
  ell(0, -88, 38, 48, BR);
  ell(0, -84, 39, 38, '#a3162a');
  ctx.fillStyle = CR; ctx.beginPath(); ctx.moveTo(-13, -120); ctx.lineTo(13, -120); ctx.lineTo(0, -68); ctx.fill();

  // free arm: waves when he dances, hangs when he doesn't
  const wv = Math.sin(ph + 1);
  const lhx = -64 - wv * 8 * d, lhy = -100 - (wv * 0.5 + 0.5) * 45 * d + 12 * (1 - d) + c * 10;
  limb(-32, -116, lhx, lhy, 13, BR); ell(lhx, lhy, 8, 8, DK);

  // cup arm: held out, shaking when he is upset
  const trem = Math.sin(tNow * 40) * c * 2.5;
  const rhx = 70 + g * 8 + trem + cupShake * Math.sin(tNow * 60) * 3;
  const rhy = -104 - Math.abs(Math.sin(ph * 2)) * 6 * d + 8 * c + trem;
  limb(32, -116, rhx, rhy, 13, BR);
  ctx.save(); ctx.translate(rhx + 4, rhy - 4);
  ctx.fillStyle = '#9aa3ab'; ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(14, -14); ctx.lineTo(10, 12); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#cfd6dc'; ctx.fillRect(-16, -17, 32, 5);
  ctx.restore();
  ell(rhx - 5, rhy + 2, 7, 7, DK);
  const cp = ctx.getTransform().transformPoint(new DOMPoint(rhx + 4, rhy - 14));
  cupX = cp.x + cam; cupY = cp.y;                             // where coins should fly to

  // ----- head -----
  ctx.save();
  ctx.translate(0, -150 + 7 * c);
  ctx.rotate(Math.sin(ph * 0.5) * d * 0.18 + Math.sin(tNow * 25) * 0.04 * c);
  const hs = 1 + 0.1 * g; ctx.scale(hs, hs);
  ell(-34, 2, 9, 10, CR); ell(34, 2, 9, 10, CR);        // ears
  ell(0, 0, 34, 32, BR);
  ctx.fillStyle = DK; ctx.beginPath(); ctx.arc(0, -2, 34, Math.PI * 1.02, -0.02); ctx.fill();   // dark cap of fur
  ell(0, 9, 25, 24, CR);                                // face

  // wet cheeks
  if (c > 0.05) {
    ctx.strokeStyle = 'rgba(150,200,255,' + 0.5 * c + ')'; ctx.lineWidth = 2.4;
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sx * 10, 9); ctx.lineTo(sx * 14, 30); ctx.stroke(); }
  }

  // eyes: when he glares, the pupils lock onto the camera
  const ery = 6 - 2.5 * g;
  for (const sx of [-1, 1]) {
    const ex = sx * 10;
    ell(ex, 3, 7, ery, '#fffdf5');
    if (c > 0) { ctx.strokeStyle = 'rgba(190,40,50,' + 0.7 * c + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(ex, 3, 7, ery, 0, 0, Math.PI * 2); ctx.stroke(); }
    const px = ex + (1 - g) * Math.sin(ph * 0.5) * 2.5, py = 3 - c * 1.5, pr = 3.6 + g * 0.8;
    ell(px, py, pr, pr, '#150a05'); ell(px - 1, py - 1.2, 1.1, 1.1, '#fff');
    // eyebrows: angry (inner ends down) then sad (inner ends up)
    const a = g * (1 - c), sd = c;
    const inner = -7 + 5 * a - 8 * sd, outer = -7 - 3 * a + 4 * sd;
    limb(sx * 19, outer, sx * 3, inner, 3.4, DK);
    // tears
    if (c > 0.05 && Math.random() < 0.25 + c * 0.5) {
      const p = ctx.getTransform().transformPoint(new DOMPoint(sx * 10 + (Math.random() - .5) * 4, 10));
      tears.push({ x: p.x + cam, y: p.y, vx: (Math.random() - .5) * 20 + sx * 15, vy: 0, life: 1.1 });
    }
  }
  ell(-3, 14, 1.6, 1.2, DK); ell(3, 14, 1.6, 1.2, DK);   // nostrils

  // mouth: smile -> flat frown -> trembling toothy grimace
  const my = 24;
  ctx.strokeStyle = DK; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  if (c > 0.05) {
    const open = 6 + c * 10 + Math.sin(tNow * 9) * 3 * c, w = 12 + c * 7;
    ctx.beginPath(); ctx.moveTo(-w, my + 3);
    ctx.quadraticCurveTo(0, my - 7, w, my + 3);
    ctx.quadraticCurveTo(0, my + 3 + open * 2, -w, my + 3);
    ctx.fillStyle = '#2a0a0e'; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#f4efe0';
    ctx.fillRect(-w, my - 3, 2 * w, 5); ctx.fillRect(-w, my + open - 2, 2 * w, 6);
    ctx.strokeStyle = DK; ctx.lineWidth = 1;
    for (let i = -3; i <= 3; i++) { const tx = i * w / 3.5; ctx.beginPath(); ctx.moveTo(tx, my - 3); ctx.lineTo(tx, my + 2); ctx.moveTo(tx, my + open - 2); ctx.lineTo(tx, my + open + 4); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = DK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w, my + 3); ctx.quadraticCurveTo(0, my - 7, w, my + 3); ctx.quadraticCurveTo(0, my + 3 + open * 2, -w, my + 3); ctx.stroke();
  } else if (g > 0.05) {
    ctx.beginPath(); ctx.moveTo(-10, my + 3); ctx.quadraticCurveTo(0, my + 3 - 8 * g, 10, my + 3); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-11, my); ctx.quadraticCurveTo(0, my + 4 + 16 * d, 11, my);
    if (d > 0.4) { ctx.quadraticCurveTo(0, my + 1, -11, my); ctx.fillStyle = '#2a0a0e'; ctx.fill(); }
    ctx.stroke();
  }

  // little fez with a tassel
  ctx.save(); ctx.translate(2, -30); ctx.rotate(-0.15);
  ctx.fillStyle = '#b3182c'; ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-11, -20); ctx.lineTo(11, -20); ctx.lineTo(14, 0); ctx.closePath(); ctx.fill();
  const tsw = Math.sin(ph * 1.5) * 3 * d;
  limb(0, -20, 13 + tsw, -10, 2, '#e8c14a'); ell(13 + tsw, -8, 2.5, 4, '#e8c14a');
  ctx.restore();

  ctx.restore();  // head
  ctx.restore();  // body
}

// an older capuchin lying on the floor: starved, grey-yellow, covered in sores, dull open eyes, needles still in
function elder(cx, cy, dir, fur, sc, extra) {
  const CR = '#b9b09b', DK = '#1a1410', FACE = '#aaa77e', SKIN = '#b8a79a';
  ctx.save(); ctx.translate(cx, cy); ctx.scale(dir * sc, sc);

  for (const q of [[-82, 22], [-56, 24], [-44, 21], [-72, 25]]) ell(q[0], q[1], 3, 1.8, '#c9a96a');
  limb(40, -2, 92, -8, 9, fur); limb(36, 8, 80, 22, 9, fur);                      // thin sprawled legs
  ell(66, -5, 6, 6, SKIN); ell(58, 15, 6, 6, SKIN);                              // knobby knees
  ell(0, -4, 62, 18, fur);                                                       // starved body
  ell(-34, -8, 22, 15, CR);                                                      // dull shoulder fur
  for (const q of [[-12, -8, 14, 7], [22, -12, 12, 6], [40, 0, 9, 6]]) ell(q[0], q[1], q[2], q[3], SKIN);   // bald patches
  ctx.strokeStyle = 'rgba(30,25,20,.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';                        // ribs showing
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(-26 + i * 11, -18); ctx.quadraticCurveTo(-22 + i * 11, -6, -28 + i * 11, 8); ctx.stroke(); }
  ell(48, 4, 7, 5, SKIN);                                                        // hip bone
  for (const q of [[-12, -8], [22, -11], [40, 1], [-4, 6]]) { ell(q[0], q[1], 5, 3.5, '#d6c25a'); ell(q[0], q[1], 3, 2, '#7a1018'); }   // weeping sores
  ctx.fillStyle = '#efe8d0';                                                     // maggots squirming in a sore
  for (let i = 0; i < 4; i++) ctx.fillRect(-14 + i * 3 + Math.sin(tNow * 3 + i) * 1.5, -9 + (i % 2) * 2 + Math.cos(tNow * 4 + i), 3, 1.4);
  limb(-30, 6, -4, 22, 9, fur); ell(-2, 23, 6, 5, DK);                           // thin limp arm
  ell(-9, 18, 11, 6, 'rgba(90,60,120,.65)'); ell(-12, 16, 6, 3.5, 'rgba(150,170,70,.6)');                  // bruises
  for (const q of [[-15, 13], [-20, 10], [-13, 19]]) ell(q[0], q[1], 1.5, 1.5, '#5a0610');                  // track marks
  limb(-25.6, 4, -18.4, 16, 5, '#3a62b0');                                       // rubber band round the arm
  ell(66, -5, 7, 4, 'rgba(90,60,120,.65)');
  syringe(-8, 19, -0.9); syringe(66, -5, -2.2);                                  // needles still in
  if (extra) syringe(-82, 27, 3.05);                                             // one dropped on the floor
  ctx.save(); ctx.translate(-74, 0); ctx.rotate(-1.3);                           // head resting on its side
  ell(-27, 2, 6, 8, '#3a281c'); ell(27, 2, 6, 8, '#3a281c');
  ell(0, 0, 27, 25, CR);
  ell(-14, -4, 7, 5, SKIN); ell(12, -6, 6, 4, SKIN);                             // bald spots
  ctx.fillStyle = DK; ctx.beginPath(); ctx.arc(0, -1, 26, Math.PI * 1.03, Math.PI * 1.97);
  ctx.lineTo(7, -8); ctx.lineTo(0, 1); ctx.lineTo(-7, -8); ctx.closePath(); ctx.fill();
  ell(0, 8, 16, 15, FACE);                                                       // yellowish, grey face
  ell(-11, 14, 5, 6, 'rgba(60,50,40,.45)'); ell(11, 14, 5, 6, 'rgba(60,50,40,.45)');                        // hollow cheeks
  ell(-9, 16, 3, 2.2, '#d6c25a'); ell(-9, 16, 1.6, 1.2, '#7a1018');              // sore on the cheek
  for (const sx of [-1, 1]) {
    ell(sx * 8, 9, 7, 3, 'rgba(60,40,80,.7)');                                   // deep dark bags
    ell(sx * 8, 3, 6, 4.5, '#d9d49a');                                           // yellow eye, no shine
    ctx.strokeStyle = 'rgba(170,30,40,.75)'; ctx.lineWidth = 0.9;                // bloodshot veins
    for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(sx * 8 + sx * 6, 3 + k * 2.2); ctx.lineTo(sx * 8 + sx * 2.5, 3 + k * 0.8); ctx.stroke(); }
    ell(sx * 8, 3.5, 1.2, 1.2, '#000');                                          // pinpoint pupil
    ctx.fillStyle = FACE; ctx.fillRect(sx * 8 - 7, -2, 14, 3.8);                 // heavy lid
  }
  ell(-2, 14, 1.3, 1, DK); ell(2, 14, 1.3, 1, DK);
  ctx.fillStyle = '#2a0a0e'; ctx.beginPath(); ctx.ellipse(0, 20, 7, 5.5, 0, 0, Math.PI * 2); ctx.fill();   // mouth hanging open
  ctx.strokeStyle = '#59597a'; ctx.lineWidth = 2; ctx.stroke();                                           // bluish lips
  ell(0, 25, 3.5, 6, '#7a5560');                                                 // tongue lolling out
  ctx.fillStyle = '#c9b96a'; ctx.fillRect(-4, 16, 2, 3); ctx.fillRect(0, 16, 2.2, 2); ctx.fillRect(3, 16, 2, 3.5);   // rotten teeth
  ell(6, 25, 4, 2.8, '#e8e8e0'); ell(2, 28, 3, 2.2, '#e8e8e0'); ell(-3, 24, 2.5, 2, '#e8e8e0');            // foam
  ctx.restore();
  ctx.strokeStyle = '#a8a04a'; ctx.lineWidth = 4; ctx.lineCap = 'round';          // sick running out of the mouth
  ctx.beginPath(); ctx.moveTo(-49, 9); ctx.quadraticCurveTo(-53, 18, -57, 24); ctx.stroke();
  ctx.restore();
}

  ctx.fillText('Click to begin', W / 2, 380);
  ctx.globalAlpha = 1;
}

function draw() {
  const L = levels();
  // the world is two screens wide; the camera pans from the first to the second
  const camX = cam, camT = clamp(cam / W, 0, 1);
  ctx.save(); ctx.translate(-camX, 0);
  drawBG(L);
  drawStreetProps();
  if (cam + W > 900) drawStreetStory();
  drawOrgan(L); drawMonkey(L);
  if (cam > 0.5) drawParents();
  drawEffects();
  ctx.restore();
  // the room gets darker as he gets angrier
  const v = ctx.createRadialGradient(W / 2, H / 2, 150, W / 2, H / 2, 520);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,' + (0.3 + 0.5 * L.g) + ')');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (pan > 13) { ctx.fillStyle = 'rgba(0,0,0,' + clamp((pan - 13) / 2, 0, 1) + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'title') drawTitle(); else if (over) drawOver(); else if (pan < 1.5) { ctx.globalAlpha = clamp(1 - pan / 1.5, 0, 1); drawHUD(L); ctx.globalAlpha = 1; }
}

let last = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
